<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f8fafc" />
  <title>CF-WebRTC · 极简点对点直传</title>
  <link rel="icon" href="./favicon.svg" />
  <link rel="stylesheet" href="./index.css" />
</head>

<body>
  <div id="app" v-cloak>
    <!-- 极简顶栏 -->
    <header class="app-header">
      <div class="header-left">
        <div class="status-dot" :class="{ online: isConnected, waiting: !isConnected && currentRoomCode }"></div>
        <div class="header-title-group">
          <div class="header-title">
            <span>{{ isConnected ? peerDeviceName : '等待连接' }}</span>
            <span v-if="isConnected" style="font-size: 11px; color: #10b981; font-weight: 500;">(直连中)</span>
          </div>
          <div class="header-sub">我的设备: {{ deviceName }}</div>
        </div>
      </div>

      <div class="header-right">
        <!-- 房间号 / 二维码收放按钮 -->
        <button class="pill-btn" @click="isQrOpen = !isQrOpen" :title="isQrOpen ? '收起二维码' : '查看二维码'">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="5" height="5" x="3" y="3" rx="1"></rect>
            <rect width="5" height="5" x="16" y="3" rx="1"></rect>
            <rect width="5" height="5" x="3" y="16" rx="1"></rect>
            <path d="M21 16h-3a2 2 0 0 0-2 2v3"></path>
            <path d="M21 21v.01"></path>
            <path d="M12 7v3a2 2 0 0 1-2 2H7"></path>
          </svg>
          <span>{{ currentRoomCode || '开房' }}</span>
        </button>

        <!-- 修改设备名 -->
        <button class="icon-btn" @click="promptRename" title="修改设备名">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
          </svg>
        </button>

        <!-- 深浅色切换 -->
        <button class="icon-btn" @click="toggleTheme" :title="theme === 'dark' ? '浅色模式' : '深色模式'">
          <svg v-if="theme === 'dark'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg v-else width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 统一消息流时间线 (Chat-First) -->
    <main class="chat-container" ref="chatContainer">
      <!-- 欢迎与配对轻量卡片 -->
      <section class="pairing-hero" v-if="!isConnected">
        <div class="hero-tagline">WebRTC 点对点直连 · 不限大小</div>
        <div class="hero-pin" @click="copyRoomLink" title="点击复制加入链接">
          {{ currentRoomCode || '------' }}
        </div>
        <p style="font-size: 12px; color: var(--text-secondary);">
          手机打开相机扫码，或输入房间码即可瞬间配对
        </p>

        <!-- 二维码折叠抽屉 -->
        <div class="qr-drawer" :class="{ open: isQrOpen }">
          <div class="qr-canvas-box">
            <canvas ref="qrCanvas" style="width: 140px; height: 140px; display: block;"></canvas>
          </div>
        </div>

        <div class="hero-actions">
          <button class="pill-btn primary" @click="copyRoomLink">复制邀请链接</button>
          <button class="pill-btn" @click="promptJoinRoom">输入对方房间码</button>
          <button class="pill-btn" @click="createNewRoom">换一个房间</button>
        </div>
      </section>

      <!-- 消息与媒体流 -->
      <template v-for="item in timeline" :key="item.id">
        <!-- 1. 系统通知消息 -->
        <div v-if="item.type === 'system'" class="system-bubble">
          <span>{{ item.text }}</span>
        </div>

        <!-- 2. 普通文本消息 -->
        <div v-else-if="item.type === 'text'" class="message-row" :class="item.sender">
          <div v-if="item.sender === 'peer'" class="message-sender-name">{{ peerDeviceName }}</div>
          <div class="text-bubble" @click="copyText(item.text)">
            {{ item.text }}
          </div>
        </div>

        <!-- 3. 多媒体/文件卡片 -->
        <div v-else-if="item.type === 'file'" class="message-row" :class="item.sender">
          <div v-if="item.sender === 'peer'" class="message-sender-name">{{ peerDeviceName }}</div>
          <div class="media-card">
            <!-- 图片预览 -->
            <div v-if="isImage(item.name) && item.blobUrl" class="image-preview-wrapper" @click="openLightbox(item.blobUrl)">
              <img :src="item.blobUrl" class="image-preview" alt="preview" />
            </div>

            <!-- 视频内联播放 -->
            <video v-else-if="isVideo(item.name) && item.blobUrl" :src="item.blobUrl" controls playsinline class="video-preview"></video>

            <!-- 音频内联播放 -->
            <div v-else-if="isAudio(item.name) && item.blobUrl" style="padding: 10px 14px;">
              <audio :src="item.blobUrl" controls style="width: 100%; height: 36px;"></audio>
            </div>

            <!-- 文件元信息行 -->
            <div class="file-meta-bar">
              <div class="file-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
              </div>
              <div class="file-info">
                <div class="file-name" :title="item.name">{{ item.name }}</div>
                <div class="file-size-sub">{{ formatBytes(item.size) }} · {{ item.statusText }}</div>
              </div>

              <!-- 下载按钮 (按需下载，关闭窗口前随时可用) -->
              <a
                v-if="item.blobUrl"
                :href="item.blobUrl"
                :download="item.name"
                class="file-action-btn"
                title="保存到本地"
                @click="item.hasDownloaded = true"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" x2="12" y1="15" y2="3"></line>
                </svg>
              </a>
            </div>

            <!-- 传输进度条与微光速率 -->
            <div v-if="item.progress < 100" class="media-progress-box">
              <div class="shimmer-progress-bg">
                <div class="shimmer-progress-fill" :style="{ width: item.progress + '%' }"></div>
              </div>
              <div class="media-progress-stat">
                <span>{{ item.progress }}%</span>
                <span>{{ formatSpeed(item.speed) }}</span>
              </div>
            </div>
          </div>
        </div>
      </template>
    </main>

    <!-- 底部悬浮输入栏 (移动端安全区自适应) -->
    <footer class="chat-bottom-bar">
      <!-- 待发送暂存区 (Staging Tray) -->
      <div v-if="stagedFiles.length > 0" class="staging-tray">
        <div v-for="(file, index) in stagedFiles" :key="index" class="staging-item">
          <img v-if="file.previewUrl" :src="file.previewUrl" class="staging-img" />
          <svg v-else width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
          </svg>
          <button class="staging-remove" @click="removeStagedFile(index)">×</button>
        </div>
      </div>

      <div class="input-pill">
        <!-- 附件按钮 -->
        <button class="icon-btn" @click="triggerFileSelect" title="选择文件或照片">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
          </svg>
        </button>

        <!-- 文本输入框 (支持直接回车发送) -->
        <input
          v-model="inputMsg"
          type="text"
          class="chat-input"
          :placeholder="stagedFiles.length > 0 ? '添加附言并回车发送...' : (isConnected ? '输入文字、直接拖拽或粘贴文件...' : '输入文字或对方房间码...')"
          @keyup.enter="handleSendAction"
        />

        <!-- 发送按钮 -->
        <button class="send-btn" @click="handleSendAction" title="发送">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>

      <input ref="fileInputEl" type="file" multiple hidden @change="onFilesSelected" />
    </footer>

    <!-- 全局拖拽悬浮目标 (Drop Target) -->
    <div class="global-drop-target" :class="{ active: isDragging }">
      <div class="drop-icon-ring">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" x2="12" y1="3" y2="15"></line>
        </svg>
      </div>
      <div style="font-size: 16px; font-weight: 600; color: var(--brand);">松开即可立即投递文件</div>
    </div>

    <!-- 全屏高清大图查看灯箱 (Lightbox) -->
    <div v-if="activeLightboxUrl" class="lightbox-modal" @click="activeLightboxUrl = null">
      <button class="lightbox-close" @click="activeLightboxUrl = null">✕</button>
      <img :src="activeLightboxUrl" class="lightbox-content" @click.stop />
    </div>
  </div>

  <script type="module">
    import { createApp, ref, reactive, onMounted, nextTick } from 'https://unpkg.com/vue@3.5.34/dist/vue.esm-browser.prod.js';
    import QRCode from 'https://esm.sh/qrcode@1.5.4';
    import { SIGNAL_TYPES, createSignalMessage, parseSignalMessage } from './utils/protocol.js';
    import { WebRTCManager } from './utils/webrtc_manager.js';
    import { FileSender, FileReceiver } from './utils/file_streamer.js';

    createApp({
      setup() {
        const theme = ref(localStorage.getItem('cf_webrtc_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
        const toggleTheme = () => {
          theme.value = theme.value === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme.value);
          localStorage.setItem('cf_webrtc_theme', theme.value);
        };
        document.documentElement.setAttribute('data-theme', theme.value);

        const detectDevice = () => {
          const ua = navigator.userAgent;
          if (/iPhone/i.test(ua)) return 'iPhone';
          if (/iPad/i.test(ua)) return 'iPad';
          if (/Android/i.test(ua)) return 'Android';
          if (/Macintosh/i.test(ua)) return 'Mac';
          if (/Windows/i.test(ua)) return 'Windows';
          return '设备';
        };

        const deviceName = ref(localStorage.getItem('cf_webrtc_device_name') || detectDevice());
        const promptRename = () => {
          const val = window.prompt('修改当前设备名称：', deviceName.value);
          if (val && val.trim()) {
            deviceName.value = val.trim();
            localStorage.setItem('cf_webrtc_device_name', deviceName.value);
          }
        };

        const myPeerId = ref(crypto.randomUUID().slice(0, 8));
        const currentRoomCode = ref('');
        const isQrOpen = ref(false);
        const qrCanvas = ref(null);
        const isConnected = ref(false);
        const peerDeviceName = ref('对端');

        // 统一对话时间线 (Chat Stream Timeline)
        const timeline = reactive([]);
        const chatContainer = ref(null);
        const scrollToBottom = async () => {
          await nextTick();
          if (chatContainer.value) {
            chatContainer.value.scrollTop = chatContainer.value.scrollHeight;
          }
        };

        const addSystemMsg = (text) => {
          timeline.push({ id: Date.now() + Math.random(), type: 'system', text });
          scrollToBottom();
        };

        // 暂存托盘 (Staging Tray)
        const stagedFiles = reactive([]);
        const inputMsg = ref('');
        const fileInputEl = ref(null);
        const isDragging = ref(false);
        const activeLightboxUrl = ref(null);

        let ws = null;
        let rtc = null;
        let activeReceivers = new Map();

        const renderQR = async (text) => {
          await nextTick();
          if (qrCanvas.value) {
            try {
              await QRCode.toCanvas(qrCanvas.value, text, {
                width: 140,
                margin: 1,
                color: { dark: '#000000', light: '#ffffff' }
              });
            } catch (err) {
              console.error('QR error:', err);
            }
          }
        };

        const createNewRoom = async () => {
          try {
            const res = await fetch('/api/room/new', { method: 'POST' });
            const data = await res.json();
            currentRoomCode.value = data.code;
            const joinUrl = `${window.location.origin}/?room=${data.code}`;
            await renderQR(joinUrl);
            connectSignaling(data.code);
          } catch (err) {
            addSystemMsg('创建房间失败: ' + err.message);
          }
        };

        const copyRoomLink = () => {
          const url = `${window.location.origin}/?room=${currentRoomCode.value}`;
          navigator.clipboard.writeText(url).then(() => {
            addSystemMsg('房间链接已复制到剪贴板！');
          });
        };

        const promptJoinRoom = () => {
          const code = window.prompt('请输入对方屏幕上的 6 位房间码：');
          if (code && code.trim()) {
            const clean = code.trim().toUpperCase();
            currentRoomCode.value = clean;
            connectSignaling(clean);
          }
        };

        const connectSignaling = (roomId) => {
          if (ws) {
            try { ws.close(); } catch (_) {}
          }

          const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
          const wsUrl = `${protocol}//${window.location.host}/ws/${roomId}?peerId=${myPeerId.value}&deviceName=${encodeURIComponent(deviceName.value)}`;

          ws = new WebSocket(wsUrl);

          rtc = new WebRTCManager({
            sendSignal: (type, payload) => {
              if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(createSignalMessage(type, payload));
              }
            },
            onConnected: () => {
              isConnected.value = true;
              isQrOpen.value = false;
              addSystemMsg(`已与 [${peerDeviceName.value}] 建立端到端加密 P2P 直连`);
            },
            onDisconnected: () => {
              isConnected.value = false;
              addSystemMsg('与对端直连已断开');
            },
            onTextMessage: (text) => {
              try {
                const data = JSON.parse(text);
                if (data.action === 'file-meta') {
                  handleIncomingMeta(data);
                } else if (data.action === 'file-end') {
                  handleIncomingEnd(data.fileId);
                } else if (data.action === 'chat') {
                  timeline.push({ id: Date.now() + Math.random(), type: 'text', sender: 'peer', text: data.text });
                  scrollToBottom();
                }
              } catch (_) {
                timeline.push({ id: Date.now() + Math.random(), type: 'text', sender: 'peer', text });
                scrollToBottom();
              }
            },
            onBinaryMessage: (arrayBuffer) => {
              handleIncomingChunk(arrayBuffer);
            }
          });

          ws.onmessage = async (e) => {
            try {
              const msg = parseSignalMessage(e.data);
              switch (msg.type) {
                case SIGNAL_TYPES.ROOM_STATE:
                  if (msg.payload.peers && msg.payload.peers.length > 0) {
                    peerDeviceName.value = msg.payload.peers[0].deviceName || '对端';
                    await rtc.startAsInitiator();
                  }
                  break;
                case SIGNAL_TYPES.PEER_JOINED:
                  peerDeviceName.value = msg.payload.deviceName || '对端';
                  addSystemMsg(`[${peerDeviceName.value}] 加入了房间`);
                  break;
                case SIGNAL_TYPES.OFFER:
                  await rtc.handleOffer(msg.payload);
                  break;
                case SIGNAL_TYPES.ANSWER:
                  await rtc.handleAnswer(msg.payload);
                  break;
                case SIGNAL_TYPES.CANDIDATE:
                  await rtc.handleCandidate(msg.payload.candidate);
                  break;
                case SIGNAL_TYPES.PEER_LEFT:
                  addSystemMsg('对端离开了房间');
                  isConnected.value = false;
                  break;
                case SIGNAL_TYPES.ERROR:
                  addSystemMsg('信令提示: ' + msg.payload.message);
                  break;
              }
            } catch (err) {
              console.error('Signal parse err:', err);
            }
          };
        };

        // 接收端逻辑 (不强制自动下载，保留在气泡中随时点击保存)
        const handleIncomingMeta = (meta) => {
          const item = reactive({
            id: meta.fileId,
            type: 'file',
            sender: 'peer',
            name: meta.name,
            size: meta.size,
            progress: 0,
            speed: 0,
            statusText: '正在传输',
            blobUrl: null,
            hasDownloaded: false,
          });
          timeline.push(item);
          scrollToBottom();

          const receiver = new FileReceiver(meta, {
            onProgress: (p, s) => {
              item.progress = Math.round(p);
              item.speed = s;
            },
            onComplete: (blob) => {
              item.progress = 100;
              item.speed = 0;
              item.statusText = '传输完成 · 可随时下载';
              if (blob) {
                item.blobUrl = URL.createObjectURL(blob);
              }
              activeReceivers.delete(meta.fileId);
              // 轻触觉震动反馈 (如设备支持)
              if (navigator.vibrate) navigator.vibrate(12);
            }
          });
          activeReceivers.set(meta.fileId, receiver);
        };

        const handleIncomingChunk = async (buf) => {
          const view = new DataView(buf);
          const fileId = view.getUint32(0, false);
          const chunkIndex = view.getUint32(4, false);
          const data = new Uint8Array(buf, 8);
          const r = activeReceivers.get(fileId);
          if (r) await r.appendChunk(chunkIndex, data);
        };

        const handleIncomingEnd = async (fileId) => {
          const r = activeReceivers.get(fileId);
          if (r) await r.finalize();
        };

        // 发送文件
        const sendStagedFiles = async () => {
          if (!stagedFiles.length) return;
          if (!rtc || !rtc.dataChannel || rtc.dataChannel.readyState !== 'open') {
            addSystemMsg('通道未建立，无法发送');
            return;
          }

          const toSend = [...stagedFiles];
          stagedFiles.splice(0, stagedFiles.length);

          for (const item of toSend) {
            const file = item.file;
            const fileId = Math.floor(Math.random() * 0x7FFFFFFF);
            const msgItem = reactive({
              id: fileId,
              type: 'file',
              sender: 'me',
              name: file.name,
              size: file.size,
              progress: 0,
              speed: 0,
              statusText: '正在发送',
              blobUrl: item.previewUrl || URL.createObjectURL(file),
            });
            timeline.push(msgItem);
            scrollToBottom();

            const sender = new FileSender(rtc.dataChannel, file, fileId, {
              onProgress: (p, s) => {
                msgItem.progress = Math.round(p);
                msgItem.speed = s;
              },
              onComplete: () => {
                msgItem.progress = 100;
                msgItem.speed = 0;
                msgItem.statusText = '发送完成';
              },
              onError: (err) => {
                msgItem.statusText = '失败: ' + err.message;
              }
            });
            await sender.start();
          }
        };

        // 综合发送动作 (支持发送文本、暂存文件、或输入房间号连接)
        const handleSendAction = () => {
          const text = inputMsg.value.trim();

          // 如果当前未连接，且用户输入的是 6 位大写房间码，直接发起连接！
          if (!isConnected.value && /^[23456789ABCDEFGHJKLMNPQRSTUVWXYZ]{6}$/i.test(text)) {
            const clean = text.toUpperCase();
            currentRoomCode.value = clean;
            connectSignaling(clean);
            inputMsg.value = '';
            return;
          }

          // 如果有暂存文件，优先触发发送文件
          if (stagedFiles.length > 0) {
            sendStagedFiles();
          }

          // 如果有文本内容，发送文本
          if (text) {
            if (rtc && rtc.dataChannel && rtc.dataChannel.readyState === 'open') {
              rtc.dataChannel.send(JSON.stringify({ action: 'chat', text }));
              timeline.push({ id: Date.now() + Math.random(), type: 'text', sender: 'me', text });
              scrollToBottom();
            } else {
              addSystemMsg('未连接到任何设备，文字已暂存');
            }
            inputMsg.value = '';
          }
        };

        // 剪贴板直粘 (Paste to Send)
        document.addEventListener('paste', (e) => {
          if (e.clipboardData && e.clipboardData.files && e.clipboardData.files.length > 0) {
            e.preventDefault();
            stageFiles(Array.from(e.clipboardData.files));
          }
        });

        // 全局文件拖拽 (Global Drag & Drop)
        window.addEventListener('dragover', (e) => {
          e.preventDefault();
          isDragging.value = true;
        });

        window.addEventListener('dragleave', (e) => {
          if (e.clientX === 0 && e.clientY === 0) {
            isDragging.value = false;
          }
        });

        window.addEventListener('drop', (e) => {
          e.preventDefault();
          isDragging.value = false;
          if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            stageFiles(Array.from(e.dataTransfer.files));
          }
        });

        // 暂存文件管理
        const stageFiles = (files) => {
          for (const f of files) {
            let previewUrl = null;
            if (f.type.startsWith('image/')) {
              previewUrl = URL.createObjectURL(f);
            }
            stagedFiles.push({ file: f, previewUrl });
          }
          // 如果已经在对话中，自动直接开始发送，无需额外操作！
          if (isConnected.value) {
            sendStagedFiles();
          }
        };

        const removeStagedFile = (idx) => {
          stagedFiles.splice(idx, 1);
        };

        const triggerFileSelect = () => {
          fileInputEl.value?.click();
        };

        const onFilesSelected = (e) => {
          if (e.target.files && e.target.files.length > 0) {
            stageFiles(Array.from(e.target.files));
            e.target.value = '';
          }
        };

        // 辅助检测函数
        const isImage = (name) => /\.(jpg|jpeg|png|gif|webp|svg|avif)$/i.test(name);
        const isVideo = (name) => /\.(mp4|webm|mov|mkv)$/i.test(name);
        const isAudio = (name) => /\.(mp3|wav|ogg|m4a|aac)$/i.test(name);

        const openLightbox = (url) => {
          activeLightboxUrl.value = url;
        };

        const copyText = (t) => {
          navigator.clipboard.writeText(t).then(() => {
            addSystemMsg('文本已复制');
          });
        };

        const formatBytes = (bytes) => {
          if (!bytes || bytes === 0) return '0 B';
          const k = 1024;
          const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
          const i = Math.floor(Math.log(bytes) / Math.log(k));
          return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        };

        const formatSpeed = (bytesPerSec) => {
          return formatBytes(bytesPerSec) + '/s';
        };

        // 关闭窗口前防呆保护 (未下载文件提醒)
        window.addEventListener('beforeunload', (e) => {
          const unsaved = timeline.some(item => item.type === 'file' && item.sender === 'peer' && item.blobUrl && !item.hasDownloaded);
          if (unsaved) {
            e.preventDefault();
            e.returnValue = '有已接收但尚未保存的文件，离开后将清除，确定关闭吗？';
          }
        });

        onMounted(() => {
          const params = new URLSearchParams(window.location.search);
          const room = params.get('room');
          if (room && room.length === 6) {
            currentRoomCode.value = room.toUpperCase();
            connectSignaling(room.toUpperCase());
          } else {
            createNewRoom();
          }
        });

        return {
          theme,
          toggleTheme,
          deviceName,
          promptRename,
          currentRoomCode,
          isQrOpen,
          qrCanvas,
          createNewRoom,
          copyRoomLink,
          promptJoinRoom,
          isConnected,
          peerDeviceName,
          timeline,
          chatContainer,
          stagedFiles,
          removeStagedFile,
          inputMsg,
          handleSendAction,
          triggerFileSelect,
          fileInputEl,
          onFilesSelected,
          isDragging,
          activeLightboxUrl,
          openLightbox,
          copyText,
          isImage,
          isVideo,
          isAudio,
          formatBytes,
          formatSpeed,
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
