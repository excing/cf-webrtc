name = "cf-webrtc"
main = "index.js"
compatibility_date = "2026-06-22"

# 需要的 secrets (用 `wrangler secret put <NAME>` 配置):
#   KEY        secret key

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/ws", "/ws/*", "/api", "/api/*"]

[observability]
enabled = true

[[durable_objects.bindings]]
name = "SIGNALING_ROOM"
class_name = "SignalingRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom"]


